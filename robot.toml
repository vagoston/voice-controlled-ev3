# What is attached to the robot, where, and what the agent should know about it.
# Edit this after rebuilding. Nothing else hardcodes ports.
#
# Motors take port letters A-D, sensors take input numbers 1-4, matching the
# labels on the brick.
#
# `note` fields are sent to the agent. Put anything it could not work out from
# the wiring there, such as a sensor's usable range or a motor whose starting
# position is unknown. Use `#` comments only for things the agent does not need.

name = "EV3D4"

[motors]
# `left` and `right` are ordinary names, but drive() requires both.
#
# `reversed = true` flips a motor whose positive direction is backwards, which
# happens when drive motors are mirror-mounted. UNVERIFIED on this build: no
# test has yet driven both wheels together. If drive(50, 50) spins the robot
# instead of moving it forward, set reversed on one of them. If it drives
# backwards, set it on both.
left = { port = "B", kind = "large", reversed = false }
right = { port = "C", kind = "large", reversed = false }
head = { port = "A", kind = "medium", note = "Starting position is unknown: the head keeps whatever angle it was left at, and there is no home switch. Centre it yourself before treating its heading as meaningful, and remember turning the head does not turn the robot." }

[sensors]
touch = { input = 1 }
color = { input = 3, note = "Needs to be within about 1cm of a surface. Further away it reads near-zero reflectance, which looks like black regardless of the real colour." }
infrared = { input = 4, note = "Proximity is 0-100 over roughly 70cm, not centimetres. Also does beacon seek, but only one mode at a time and switching costs about 45ms." }

# Not fitted on this build: ultrasonic, gyro, sound.
# Their helpers return None rather than guessing.

[geometry]
wheel_diameter_mm = 30   # outer diameter of a driven wheel
axle_track_mm = 140      # centre to centre between the two driven wheels
