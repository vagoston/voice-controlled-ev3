# Hardware profile: the single source of truth for what is plugged in where.
#
# Rebuilt the robot? Edit this file, nothing else. `list_devices` compares it
# against what the brick actually reports and tells you where they disagree.
#
# Motors are port letters A-D, sensors are input numbers 1-4, matching the
# labels printed on the brick.

name = "EV3D4"

[motors]
left = "B"   # left drive, large motor
right = "C"  # right drive, large motor

[motors.named]
# Anything that is not drive. Skills address these by name: motor("head", ...)
head = "A"   # medium motor

[sensors]
# Only list what is actually attached. Anything missing here is reported as
# absent rather than probed for, so a skill asking for it gets told plainly.
touch = 1
color = 3
infrared = 4
# ultrasonic = ...   # not on this build
# gyro = ...         # not on this build

# [geometry]
# Wheel diameter and axle track in mm, needed before movement can be expressed
# in real units (forward(cm=30), turn(degrees=90)) instead of guessed durations.
# Deliberately absent rather than guessed -- measure the robot and fill these in
# when that work happens.
